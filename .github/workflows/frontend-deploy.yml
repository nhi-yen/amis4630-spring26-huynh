name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test:run -- --passWithNoTests

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build_test

    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Create deployment zip
        run: |
          cd dist
          zip -r ../frontend-dist.zip .

      - name: Deploy to Azure App Service via ZipDeploy
        shell: pwsh
        env:
          AZURE_FRONTEND_PUBLISH_PROFILE: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_FRONTEND_PUBLISH_PROFILE)) {
            throw "AZURE_FRONTEND_PUBLISH_PROFILE is empty or missing."
          }

          [xml]$publishProfileXml = $env:AZURE_FRONTEND_PUBLISH_PROFILE
          $zipProfile = $publishProfileXml.publishData.publishProfile |
            Where-Object { $_.publishMethod -eq 'ZipDeploy' } |
            Select-Object -First 1

          if (-not $zipProfile) {
            throw "ZipDeploy profile not found in AZURE_FRONTEND_PUBLISH_PROFILE."
          }

          $publishUrl = $zipProfile.publishUrl
          $userName = $zipProfile.userName
          $userPassword = $zipProfile.userPWD

          if ([string]::IsNullOrWhiteSpace($publishUrl) -or
              [string]::IsNullOrWhiteSpace($userName) -or
              [string]::IsNullOrWhiteSpace($userPassword)) {
            throw "Publish profile is missing publishUrl, userName, or userPWD."
          }

          if ($userName -eq 'REDACTED' -or $userPassword -eq 'REDACTED') {
            throw "AZURE_FRONTEND_PUBLISH_PROFILE contains redacted credentials. Download the publish profile from Azure Portal (Get publish profile), then paste the full file content into the GitHub secret."
          }

          $zipPath = Join-Path $PWD "frontend-dist.zip"
          if (-not (Test-Path $zipPath)) {
            throw "Deployment zip not found at $zipPath"
          }

          $basicAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$userName`:$userPassword"))
          $headers = @{ Authorization = "Basic $basicAuth" }
          $zipDeployUrl = "https://$publishUrl/api/zipdeploy"

          $response = Invoke-WebRequest -Uri $zipDeployUrl -Method Post -Headers $headers -InFile $zipPath -ContentType "application/zip"
          Write-Host "ZipDeploy HTTP status: $($response.StatusCode)"
