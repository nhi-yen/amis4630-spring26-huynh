name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore backend/BuckeyeMarketplaceApi/BuckeyeMarketplaceApi.csproj -p:NuGetAudit=false

      - name: Restore tests
        run: dotnet restore backend/BuckeyeMarketplaceApi.Tests/BuckeyeMarketplaceApi.Tests.csproj -p:NuGetAudit=false

      - name: Build API
        run: dotnet build backend/BuckeyeMarketplaceApi/BuckeyeMarketplaceApi.csproj --configuration Release --no-restore -p:NuGetAudit=false

      - name: Run backend tests
        run: dotnet test backend/BuckeyeMarketplaceApi.Tests/BuckeyeMarketplaceApi.Tests.csproj --configuration Release -p:NuGetAudit=false

  deploy:
    runs-on: ubuntu-latest
    needs: build_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish API
        run: dotnet publish backend/BuckeyeMarketplaceApi/BuckeyeMarketplaceApi.csproj --configuration Release --output ./publish -p:NuGetAudit=false

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
